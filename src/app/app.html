<div class="app-container">
  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button (click)="goHome()" aria-label="Home">
      <mat-icon>home</mat-icon>
    </button>

    <span class="app-title" (click)="goHome()">
      {{ translate('app.title') }}
    </span>

    <span class="spacer"></span>

    <button mat-raised-button (click)="goCreate()" class="create-btn">
      <mat-icon>add</mat-icon>
      {{ translate('nav.create') }}
    </button>

    <button mat-icon-button [matMenuTriggerFor]="languageMenu" aria-label="Language menu">
      <mat-icon>language</mat-icon>
    </button>
    <mat-menu #languageMenu="matMenu">
      @for (lang of getAvailableLanguages(); track lang.code) {
      <button
        mat-menu-item
        (click)="changeLanguage(lang.code)"
        [class.active]="getCurrentLanguage() === lang.code"
      >
        <mat-icon>{{ getCurrentLanguage() === lang.code ? 'check' : '' }}</mat-icon>
        <span>{{ lang.nativeLabel }}</span>
      </button>
      }
    </mat-menu>
  </mat-toolbar>

  @if (loadingService.isLoading()) {
  <mat-progress-bar mode="indeterminate" color="accent"></mat-progress-bar>
  }

  <main class="app-content">
    <router-outlet />
  </main>
</div>
